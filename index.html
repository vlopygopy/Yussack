<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yussack Saputra — Project Management Officer</title>
    <meta name="description" content="Portofolio Yussack Saputra — manajemen proyek, analisis data, dan pengembangan Lua / Roblox." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script>
      // Terapkan tema tersimpan sebelum render agar tidak berkedip.
      try {
        if (window.localStorage.getItem("yussack-theme") === "light") {
          document.documentElement.classList.add("light");
        }
      } catch (e) {}
    </script>
    <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="stars" aria-hidden="true"></div>
    <div class="liquid-aurora" aria-hidden="true"></div>
    <nav class="site-navigation" aria-label="Navigasi utama">
      <div class="nav-pill glass" id="nav"></div>
    </nav>
    <main id="app" class="page-transition"></main>
    <footer id="footer"></footer>
  </body>
</html>
